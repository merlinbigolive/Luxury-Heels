<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClassyHeels Admin</title><link rel="stylesheet" href="styles.css"></head><body><main class="checkoutWrap"><div class="logo checkoutLogo">CLASSYHEELS<small>PRIVATE ADMIN</small></div><p class="eyebrow">INVENTORY & ORDERS</p><h1>Store dashboard</h1><label>Admin token<input id="token" type="password"></label><button class="cta" id="load">Load inventory & orders</button><div id="out"></div></main><script>load.onclick=async()=>{const h={Authorization:'Bearer '+token.value};const [p,o]=await Promise.all([fetch('/api/products',{headers:h}),fetch('/api/admin/orders',{headers:h})]);out.innerHTML='<h2>Products</h2><pre>'+JSON.stringify(await p.json(),null,2)+'</pre><h2>Orders</h2><pre>'+JSON.stringify(await o.json(),null,2)+'</pre>'}</script></body></html>
